<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsVocab rewards · Log in</title>
<style>
:root { --bg:#f3f5f7; --panel:#fff; --text:#1b2127; --muted:#5f6b76; --line:#dde2e7; --accent:#1f4e79; --err:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181c; --panel:#1c2126; --text:#e8ecef; --muted:#9aa5af; --line:#2c333a; --accent:#7db3e3; --err:#ff8a80; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
form { width:min(360px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; }
h1 { margin:0 0 4px; font-size:20px; }
p { margin:0 0 16px; color:var(--muted); font-size:13px; }
label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
input { width:100%; padding:8px 10px; margin-bottom:14px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
button { width:100%; padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
@media (prefers-color-scheme: dark) { button { color:#0b1a28; } }
button:disabled { opacity:.5; cursor:not-allowed; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#err { color:var(--err); font-size:14px; margin:0 0 12px; min-height:1.4em; }
</style>
</head>
<body>
<form id="f">
  <h1>Rewards admin</h1>
  <p>Log in to review pending reward claims.</p>
  <label for="user">User</label>
  <input id="user" name="user" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div id="err" role="alert"></div>
  <button id="go" type="submit">Log in</button>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value, password: document.getElementById("password").value }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.reload(); return; }
    err.textContent = data.error || "Could not log in.";
  } catch (x) { err.textContent = "Cannot reach the admin server."; }
  go.disabled = false;
});
</script>
</body>
</html>
